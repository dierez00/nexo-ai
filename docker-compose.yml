# Arranque local. Por defecto la API usa la DB de Supabase (DATABASE_URL en .env).
#   docker compose up --build api
# Para Postgres local (pgvector) offline, apunta DATABASE_URL a él y activa el perfil:
#   docker compose --profile local-db up --build

services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo
      POSTGRES_DB: nexo_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
