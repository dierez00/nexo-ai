[project]
name = "nexo-integrations"
version = "0.1.0"
description = "nexo-ai — adapters de proveedores externos (Twilio, modelos, storage, institucional)"
requires-python = ">=3.12"
dependencies = [
    "twilio>=9.3",
    "httpx>=0.27",
    "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexo_integrations"]
