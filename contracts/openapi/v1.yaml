components:
  schemas:
    A2UIAction:
      additionalProperties: false
      description: Acción opaca ligada a un schema, una versión y un run concreto
        (§5.5).
      properties:
        action_id:
          maxLength: 67
          minLength: 5
          title: Action Id
          type: string
        expected_version:
          minimum: 1.0
          title: Expected Version
          type: integer
        input_schema_ref:
          maxLength: 300
          title: Input Schema Ref
          type: string
        label:
          maxLength: 120
          title: Label
          type: string
        requires_confirmation:
          default: true
          title: Requires Confirmation
          type: boolean
        tool_name:
          maxLength: 95
          title: Tool Name
          type: string
      required:
      - action_id
      - tool_name
      - input_schema_ref
      - expected_version
      - label
      title: A2UIAction
      type: object
    A2UIComponent:
      additionalProperties: false
      description: 'Nodo del árbol de componentes.


        Los datos viven en el data model y se referencian por binding (`{"path": ...}`);

        la estructura nunca los incrusta (`DIE-F1-102`).


        En el protocolo, las propiedades específicas del componente viajan aplanadas

        junto a `id` y `component`. Aquí se validan agrupadas bajo `properties` para

        mantener el modelo cerrado, y la (de)serialización hace la conversión: los

        fixtures que consume el renderer de Cris salen con la forma del protocolo,

        sin traducción implícita a cargo del consumidor (`DIE-F0-019`).'
      properties:
        actionId:
          anyOf:
          - maxLength: 67
            minLength: 5
            type: string
          - type: 'null'
          title: Actionid
        children:
          items:
            pattern: ^[a-z][a-z0-9-]{0,62}$
            type: string
          maxItems: 100
          title: Children
          type: array
        component:
          pattern: ^[A-Z][A-Za-z0-9]{1,40}$
          title: Component
          type: string
        id:
          pattern: ^[a-z][a-z0-9-]{0,62}$
          title: Id
          type: string
        properties:
          additionalProperties:
            $ref: '#/components/schemas/JsonValue'
          title: Properties
          type: object
      required:
      - id
      - component
      title: A2UIComponent
      type: object
    A2UIMessage:
      additionalProperties: false
      description: 'Unidad JSONL del protocolo: exactamente uno de los tres mensajes.'
      properties:
        createSurface:
          anyOf:
          - $ref: '#/components/schemas/CreateSurface'
          - type: 'null'
        updateComponents:
          anyOf:
          - $ref: '#/components/schemas/UpdateComponents'
          - type: 'null'
        updateDataModel:
          anyOf:
          - $ref: '#/components/schemas/UpdateDataModel'
          - type: 'null'
        version:
          default: v0.9.1
          title: Version
          type: string
      title: A2UIMessage
      type: object
    A2UISurface:
      additionalProperties: false
      description: 'Superficie completa: la secuencia ordenada de mensajes más sus
        acciones.'
      properties:
        actions:
          items:
            $ref: '#/components/schemas/A2UIAction'
          maxItems: 20
          title: Actions
          type: array
        catalog_id:
          description: URN inmutable del catálogo negociado, por ejemplo 'urn:nexo-ia:a2ui:catalog:citizen:v1'.
          maxLength: 200
          pattern: ^urn:nexo-ia:a2ui:catalog:[a-z0-9_-]+:v\d+$
          title: Catalog Id
          type: string
        channel:
          $ref: '#/components/schemas/Channel'
        messages:
          items:
            $ref: '#/components/schemas/A2UIMessage'
          maxItems: 100
          minItems: 1
          title: Messages
          type: array
        surface_id:
          maxLength: 68
          minLength: 6
          title: Surface Id
          type: string
      required:
      - surface_id
      - catalog_id
      - channel
      - messages
      title: A2UISurface
      type: object
    ActionResult:
      additionalProperties: false
      description: Resultado de ejecutar una acción confirmada (§5.1).
      properties:
        action_id:
          maxLength: 67
          minLength: 5
          title: Action Id
          type: string
        error:
          anyOf:
          - $ref: '#/components/schemas/NormalizedError'
          - type: 'null'
        idempotency_replayed:
          default: false
          title: Idempotency Replayed
          type: boolean
        status:
          $ref: '#/components/schemas/ActionStatus'
        tool_call_id:
          anyOf:
          - maxLength: 66
            minLength: 4
            type: string
          - type: 'null'
          title: Tool Call Id
        tool_result:
          anyOf:
          - $ref: '#/components/schemas/ToolResult'
          - type: 'null'
      required:
      - action_id
      - status
      title: ActionResult
      type: object
    ActionStatus:
      enum:
      - pending_confirmation
      - confirmed
      - succeeded
      - failed
      - partial
      - cancelled
      title: ActionStatus
      type: string
    ActorType:
      description: Quién origina un evento.
      enum:
      - supervisor
      - agent
      - tool
      - model
      - retriever
      - system
      - user
      title: ActorType
      type: string
    AdminCatalog:
      properties:
        modules:
          items:
            $ref: '#/components/schemas/ModuleEntry'
          title: Modules
          type: array
        permissions:
          items:
            $ref: '#/components/schemas/PermissionEntry'
          title: Permissions
          type: array
        roles:
          items:
            $ref: '#/components/schemas/RoleEntry'
          title: Roles
          type: array
      required:
      - modules
      - roles
      - permissions
      title: AdminCatalog
      type: object
    AgentName:
      description: Agentes de la matriz §13. El catálogo cerrado impide delegar a
        un agente inexistente.
      enum:
      - classifier
      - supervisor
      - domain_navigator
      - verifier
      - estimator
      - transactional
      - writer
      - signal_analyst
      - judge
      - prompt_assistant
      title: AgentName
      type: string
    AppointmentHold:
      properties:
        appointment_id:
          title: Appointment Id
          type: string
        branch_id:
          title: Branch Id
          type: integer
        ends_at:
          format: date-time
          title: Ends At
          type: string
        hold_expires_at:
          format: date-time
          title: Hold Expires At
          type: string
        module_code:
          title: Module Code
          type: string
        service_name:
          title: Service Name
          type: string
        starts_at:
          format: date-time
          title: Starts At
          type: string
        status:
          title: Status
          type: string
      required:
      - appointment_id
      - status
      - branch_id
      - module_code
      - service_name
      - starts_at
      - ends_at
      - hold_expires_at
      title: AppointmentHold
      type: object
    AppointmentSlot:
      properties:
        available:
          title: Available
          type: boolean
        ends_at:
          format: date-time
          title: Ends At
          type: string
        starts_at:
          format: date-time
          title: Starts At
          type: string
      required:
      - starts_at
      - ends_at
      - available
      title: AppointmentSlot
      type: object
    Branch:
      properties:
        branch_id:
          title: Branch Id
          type: string
        code:
          title: Code
          type: string
        name:
          title: Name
          type: string
      required:
      - branch_id
      - code
      - name
      title: Branch
      type: object
    Budgets:
      additionalProperties: false
      description: 'Presupuestos del run (`DIE-F0-034`).


        Se aplican en el supervisor y en cada nodo: antes de invocar un modelo o una

        tool se comprueba lo que queda, no después.'
      properties:
        deadline_ms:
          default: 20000
          maximum: 3600000.0
          minimum: 0.0
          title: Deadline Ms
          type: integer
        max_attempts_per_agent:
          default: 2
          maximum: 5.0
          minimum: 1.0
          title: Max Attempts Per Agent
          type: integer
        max_concurrency:
          default: 2
          maximum: 10.0
          minimum: 1.0
          title: Max Concurrency
          type: integer
        max_cost_usd:
          default: 0.2
          maximum: 100.0
          minimum: 0.0
          title: Max Cost Usd
          type: number
        max_tokens:
          default: 200000
          minimum: 0.0
          title: Max Tokens
          type: integer
      title: Budgets
      type: object
    CatalogEntry:
      additionalProperties: false
      properties:
        audience:
          maxLength: 40
          title: Audience
          type: string
        catalog_id:
          maxLength: 200
          title: Catalog Id
          type: string
        path:
          maxLength: 300
          title: Path
          type: string
        version:
          pattern: ^\d+\.\d+\.\d+$
          title: Version
          type: string
      required:
      - catalog_id
      - version
      - audience
      - path
      title: CatalogEntry
      type: object
    CatalogsConfig:
      additionalProperties: false
      description: '`config/catalogs.yaml`: catálogos A2UI negociables.'
      properties:
        catalogs:
          items:
            $ref: '#/components/schemas/CatalogEntry'
          maxItems: 20
          minItems: 1
          title: Catalogs
          type: array
        version:
          pattern: ^[a-z0-9][a-z0-9._-]{2,39}$
          title: Version
          type: string
      required:
      - version
      - catalogs
      title: CatalogsConfig
      type: object
    Channel:
      enum:
      - web
      - whatsapp
      - voice
      title: Channel
      type: string
    ChannelFallback:
      additionalProperties: false
      description: 'Representación segura cuando la superficie no puede renderizarse
        (§5.5).


        Nunca queda vacío: si A2UI falla, el canal recibe texto plano equivalente
        en

        lugar de nada (`DIE-F1-106`).'
      properties:
        action_hint:
          anyOf:
          - maxLength: 300
            type: string
          - type: 'null'
          title: Action Hint
        channel:
          $ref: '#/components/schemas/Channel'
        numbered_items:
          items:
            type: string
          maxItems: 50
          title: Numbered Items
          type: array
        reason:
          maxLength: 200
          title: Reason
          type: string
        text:
          maxLength: 4000
          minLength: 1
          title: Text
          type: string
      required:
      - channel
      - reason
      - text
      title: ChannelFallback
      type: object
    ConfirmActionRequest:
      additionalProperties: false
      properties:
        consent:
          default: false
          title: Consent
          type: boolean
        expected_version:
          minimum: 1.0
          title: Expected Version
          type: integer
      required:
      - expected_version
      title: ConfirmActionRequest
      type: object
    Contradiction:
      additionalProperties: false
      description: Conflicto detectado entre hechos, fuentes o resultados de tools
        (§5.2).
      properties:
        conflicting_sources:
          items:
            maxLength: 67
            minLength: 5
            type: string
          maxItems: 20
          title: Conflicting Sources
          type: array
        conflicting_tool_calls:
          items:
            maxLength: 66
            minLength: 4
            type: string
          maxItems: 20
          title: Conflicting Tool Calls
          type: array
        contradiction_id:
          maxLength: 70
          minLength: 8
          title: Contradiction Id
          type: string
        explanation:
          maxLength: 1000
          title: Explanation
          type: string
        fact_ids:
          items:
            maxLength: 68
            minLength: 6
            type: string
          maxItems: 10
          minItems: 2
          title: Fact Ids
          type: array
        resolved_fact_id:
          anyOf:
          - maxLength: 68
            minLength: 6
            type: string
          - type: 'null'
          title: Resolved Fact Id
        rule:
          description: 'Regla de precedencia aplicada. Ejemplo: ''newer_source_wins''.'
          maxLength: 200
          title: Rule
          type: string
        severity:
          $ref: '#/components/schemas/ContradictionSeverity'
        status:
          $ref: '#/components/schemas/ContradictionStatus'
          default: detected
      required:
      - contradiction_id
      - fact_ids
      - severity
      - rule
      - explanation
      title: Contradiction
      type: object
    ContradictionSeverity:
      description: Una contradicción crítica bloquea toda escritura dependiente (`DIE-F4-020`).
      enum:
      - informational
      - material
      - critical
      title: ContradictionSeverity
      type: string
    ContradictionStatus:
      enum:
      - detected
      - resolved
      - unresolved
      title: ContradictionStatus
      type: string
    Conversation:
      properties:
        channel:
          title: Channel
          type: string
        conversation_id:
          title: Conversation Id
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        status:
          title: Status
          type: string
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
      required:
      - conversation_id
      - channel
      - status
      - created_at
      title: Conversation
      type: object
    ConversationCreate:
      properties:
        channel:
          default: web
          enum:
          - web
          - whatsapp
          - voice
          - admin
          title: Channel
          type: string
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
      title: ConversationCreate
      type: object
    CountByStatus:
      properties:
        by_status:
          additionalProperties:
            type: integer
          title: By Status
          type: object
        total:
          default: 0
          title: Total
          type: integer
      title: CountByStatus
      type: object
    CreateSurface:
      additionalProperties: false
      properties:
        catalogId:
          description: URN inmutable del catálogo negociado, por ejemplo 'urn:nexo-ia:a2ui:catalog:citizen:v1'.
          maxLength: 200
          pattern: ^urn:nexo-ia:a2ui:catalog:[a-z0-9_-]+:v\d+$
          title: Catalogid
          type: string
        sendDataModel:
          default: false
          title: Senddatamodel
          type: boolean
        surfaceId:
          maxLength: 68
          minLength: 6
          title: Surfaceid
          type: string
      required:
      - surfaceId
      - catalogId
      title: CreateSurface
      type: object
    Domain:
      description: Los cinco namespaces iniciales (§2.3). Un dominio fuera de esta
        lista se rechaza.
      enum:
      - vehiculos
      - ayuntamiento_empresas
      - registro_civil
      - salud
      - ganaderia
      title: Domain
      type: string
    ErrorCode:
      description: 'Códigos de error estables (arquitectura §9.11).


        El consumidor decide por `code`, nunca por el texto del mensaje.'
      enum:
      - VALIDATION_ERROR
      - AUTHENTICATION_REQUIRED
      - PERMISSION_DENIED
      - RESOURCE_NOT_FOUND
      - APPOINTMENT_CONFLICT
      - VERSION_CONFLICT
      - ACTION_CONFIRMATION_REQUIRED
      - RATE_LIMITED
      - BUDGET_EXCEEDED
      - PROVIDER_ERROR
      - MODEL_UNAVAILABLE
      - MODEL_OUTPUT_INVALID
      - TOOL_TIMEOUT
      - TOOL_NOT_FOUND
      - RUN_TIMEOUT
      - RUN_CANCELLED
      - UNKNOWN_OUTCOME
      - CONFIGURATION_INVALID
      - CONTRACT_INVALID
      title: ErrorCode
      type: string
    ErrorDetail:
      additionalProperties: false
      description: Detalle accionable de un error, sin contenido sensible.
      properties:
        field:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          description: Ruta del campo que falló, en notación de puntos.
          title: Field
        reason:
          description: 'Motivo estable y corto, en snake_case. Ejemplo: ''conflict''.'
          maxLength: 200
          title: Reason
          type: string
      required:
      - reason
      title: ErrorDetail
      type: object
    Estimate:
      additionalProperties: false
      description: 'Resultado del estimador: pasos ordenados, costo total y trazabilidad.'
      properties:
        derived_from:
          items:
            maxLength: 68
            minLength: 6
            type: string
          maxItems: 200
          title: Derived From
          type: array
        domain:
          $ref: '#/components/schemas/Domain'
        steps:
          items:
            $ref: '#/components/schemas/EstimateStep'
          maxItems: 100
          title: Steps
          type: array
        total_cost:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
      required:
      - domain
      title: Estimate
      type: object
    EstimateStep:
      additionalProperties: false
      description: Un trámite dentro de la ruta calculada, con dependencias estables.
      properties:
        cost:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        depends_on:
          items:
            pattern: ^[a-z][a-z0-9_]{1,62}$
            type: string
          maxItems: 20
          title: Depends On
          type: array
        derived_from:
          items:
            maxLength: 68
            minLength: 6
            type: string
          maxItems: 50
          minItems: 1
          title: Derived From
          type: array
        duration_days:
          anyOf:
          - maximum: 3650.0
            minimum: 0.0
            type: integer
          - type: 'null'
          title: Duration Days
        missing_documents:
          items:
            type: string
          maxItems: 30
          title: Missing Documents
          type: array
        step_id:
          pattern: ^[a-z][a-z0-9_]{1,62}$
          title: Step Id
          type: string
        title:
          maxLength: 200
          title: Title
          type: string
      required:
      - step_id
      - title
      - derived_from
      title: EstimateStep
      type: object
    EventActor:
      additionalProperties: false
      description: Quién produjo el evento.
      properties:
        name:
          maxLength: 120
          title: Name
          type: string
        type:
          $ref: '#/components/schemas/ActorType'
      required:
      - type
      - name
      title: EventActor
      type: object
    EventStatus:
      enum:
      - started
      - succeeded
      - failed
      - denied
      - skipped
      title: EventStatus
      type: string
    EventType:
      description: 'Familias mínimas de eventos (§5.8).


        El nombre es `dominio.acción` y es estable: el workflow viewer, el replay
        y

        las evaluaciones dependen de él.'
      enum:
      - run.queued
      - run.planning
      - run.started
      - run.waiting_confirmation
      - run.resumed
      - run.partial
      - run.completed
      - run.failed
      - run.cancelled
      - classification.started
      - classification.completed
      - classification.failed
      - plan.created
      - plan.updated
      - agent.started
      - agent.completed
      - agent.retried
      - agent.failed
      - rag.started
      - rag.completed
      - rag.filtered
      - rag.failed
      - tool.requested
      - tool.authorized
      - tool.denied
      - tool.started
      - tool.completed
      - tool.replayed
      - tool.failed
      - model.selected
      - model.fallback
      - model.completed
      - model.failed
      - verification.completed
      - contradiction.detected
      - contradiction.resolved
      - contradiction.unresolved
      - checkpoint.saved
      - checkpoint.restored
      - a2ui.generated
      - a2ui.validated
      - a2ui.validation_failed
      - a2ui.fallback
      - evaluation.started
      - evaluation.completed
      - evaluation.failed
      - prompt.drafted
      - prompt.validated
      - prompt.approved
      - prompt.rejected
      - prompt.published
      - corpus.drafted
      - corpus.validated
      - corpus.activated
      - corpus.rolled_back
      title: EventType
      type: string
    EventVisibility:
      description: Quién puede consumir el payload detallado de un evento.
      enum:
      - public
      - restricted
      title: EventVisibility
      type: string
    FactCategory:
      description: Naturaleza de un hecho. Determina si su citación es obligatoria.
      enum:
      - requirement
      - cost
      - location
      - validity
      - schedule
      - dependency
      - procedure
      - action_result
      - context
      title: FactCategory
      type: string
    FactValue:
      additionalProperties: false
      description: 'Valor tipado de un hecho.


        Se modela como una unión explícita en lugar de `Any` para que el estimador

        nunca tenga que adivinar el tipo antes de sumar o comparar.'
      properties:
        boolean:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Boolean
        date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Date
        items:
          anyOf:
          - items:
              type: string
            maxItems: 100
            type: array
          - type: 'null'
          title: Items
        money:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        number:
          anyOf:
          - type: number
          - type: 'null'
          title: Number
        text:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Text
      title: FactValue
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HoldCreate:
      properties:
        branch_id:
          title: Branch Id
          type: integer
        ends_at:
          format: date-time
          title: Ends At
          type: string
        module_code:
          title: Module Code
          type: string
        service_name:
          title: Service Name
          type: string
        starts_at:
          format: date-time
          title: Starts At
          type: string
      required:
      - branch_id
      - module_code
      - service_name
      - starts_at
      - ends_at
      title: HoldCreate
      type: object
    Institution:
      properties:
        name:
          title: Name
          type: string
        slug:
          title: Slug
          type: string
        tenant_id:
          title: Tenant Id
          type: string
      required:
      - tenant_id
      - name
      - slug
      title: Institution
      type: object
    JsonValue: {}
    LiveResponse:
      properties:
        status:
          const: alive
          default: alive
          title: Status
          type: string
      title: LiveResponse
      type: object
    LoginRequest:
      properties:
        email:
          title: Email
          type: string
        password:
          title: Password
          type: string
      required:
      - email
      - password
      title: LoginRequest
      type: object
    LoginResponse:
      properties:
        profile:
          $ref: '#/components/schemas/UserProfile'
        tokens:
          $ref: '#/components/schemas/TokenPair'
      required:
      - tokens
      - profile
      title: LoginResponse
      type: object
    MessageCreate:
      properties:
        content:
          minLength: 1
          title: Content
          type: string
      required:
      - content
      title: MessageCreate
      type: object
    MetricSet:
      properties:
        actions:
          $ref: '#/components/schemas/CountByStatus'
        appointments:
          $ref: '#/components/schemas/CountByStatus'
        conversations_total:
          default: 0
          title: Conversations Total
          type: integer
        generated_at:
          format: date-time
          title: Generated At
          type: string
        runs:
          $ref: '#/components/schemas/RunMetricsSummary'
        window:
          $ref: '#/components/schemas/MetricWindow'
      required:
      - window
      - runs
      - actions
      - appointments
      - generated_at
      title: MetricSet
      type: object
    MetricWindow:
      properties:
        end:
          format: date-time
          title: End
          type: string
        start:
          format: date-time
          title: Start
          type: string
      required:
      - start
      - end
      title: MetricWindow
      type: object
    ModelAliasConfig:
      additionalProperties: false
      description: Un alias lógico resuelto a un proveedor. Los agentes solo conocen
        el alias.
      properties:
        alias:
          description: Alias lógico como 'high_accuracy' o 'structured_small'.
          pattern: ^[a-z][a-z0-9_]{2,40}$
          title: Alias
          type: string
        capabilities:
          $ref: '#/components/schemas/ModelCapabilities'
        enabled:
          default: true
          title: Enabled
          type: boolean
        provider_ref:
          $ref: '#/components/schemas/ProviderRef'
      required:
      - alias
      - provider_ref
      - capabilities
