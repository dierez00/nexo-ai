          description: Folio, UUID o identificador devuelto por el sistema destino.
          maxLength: 120
          minLength: 3
          title: Identifier
          type: string
        identifier_kind:
          default: folio
          maxLength: 40
          title: Identifier Kind
          type: string
        is_mock:
          default: true
          title: Is Mock
          type: boolean
        issued_at:
          format: date-time
          title: Issued At
          type: string
      required:
      - identifier
      - issued_at
      title: ToolConfirmation
      type: object
    ToolError:
      additionalProperties: false
      description: Error normalizado de una tool (§5.4).
      properties:
        error:
          $ref: '#/components/schemas/NormalizedError'
        provider:
          default: mock
          maxLength: 100
          title: Provider
          type: string
        safe_details:
          additionalProperties:
            $ref: '#/components/schemas/JsonValue'
          title: Safe Details
          type: object
      required:
      - error
      title: ToolError
      type: object
    ToolMode:
      description: Modo de una tool. Solo `WRITE` puede producir efectos externos.
      enum:
      - read
      - write
      - compute
      title: ToolMode
      type: string
    ToolRegistryConfig:
      additionalProperties: false
      description: '`config/tool_registry.yaml`.'
      properties:
        tools:
          items:
            $ref: '#/components/schemas/ToolRegistryEntry'
          maxItems: 200
          title: Tools
          type: array
        version:
          pattern: ^[a-z0-9][a-z0-9._-]{2,39}$
          title: Version
          type: string
      required:
      - version
      title: ToolRegistryConfig
      type: object
    ToolRegistryEntry:
      additionalProperties: false
      description: Una tool registrada, siempre con versión explícita (`DIE-F0-032`).
      properties:
        domain:
          $ref: '#/components/schemas/Domain'
        enabled:
          default: false
          title: Enabled
          type: boolean
        institution_id:
          anyOf:
          - maxLength: 70
            type: string
          - type: 'null'
          description: Nulo significa disponible para toda institución.
          title: Institution Id
        mode:
          $ref: '#/components/schemas/ToolMode'
          default: read
        name:
          description: Nombre `dominio.verbo_objeto`, por ejemplo 'vehiculos.reservar_cita'.
          maxLength: 95
          title: Name
          type: string
        version:
          pattern: ^\d+\.\d+\.\d+$
          title: Version
          type: string
      required:
      - name
      - version
      - domain
      title: ToolRegistryEntry
      type: object
    ToolResult:
      additionalProperties: false
      description: Resultado de una invocación (§5.4).
      properties:
        confirmation:
          anyOf:
          - $ref: '#/components/schemas/ToolConfirmation'
          - type: 'null'
        data:
          additionalProperties:
            $ref: '#/components/schemas/JsonValue'
          title: Data
          type: object
        duration_ms:
          maximum: 3600000.0
          minimum: 0.0
          title: Duration Ms
          type: integer
        error:
          anyOf:
          - $ref: '#/components/schemas/ToolError'
          - type: 'null'
        idempotency_replayed:
          default: false
          title: Idempotency Replayed
          type: boolean
        is_mock:
          default: true
          title: Is Mock
          type: boolean
        name:
          description: Nombre `dominio.verbo_objeto`, por ejemplo 'vehiculos.reservar_cita'.
          maxLength: 95
          title: Name
          type: string
        provider:
          default: mock
          maxLength: 100
          title: Provider
          type: string
        status:
          $ref: '#/components/schemas/ToolCallStatus'
        tool_call_id:
          maxLength: 66
          minLength: 4
          title: Tool Call Id
          type: string
      required:
      - tool_call_id
      - name
      - status
      - duration_ms
      title: ToolResult
      type: object
    UpdateComponents:
      additionalProperties: false
      properties:
        components:
          items:
            $ref: '#/components/schemas/A2UIComponent'
          maxItems: 200
          minItems: 1
          title: Components
          type: array
        surfaceId:
          maxLength: 68
          minLength: 6
          title: Surfaceid
          type: string
      required:
      - surfaceId
      - components
      title: UpdateComponents
      type: object
    UpdateDataModel:
      additionalProperties: false
      properties:
        path:
          maxLength: 300
          pattern: ^/[A-Za-z0-9_/-]*$
          title: Path
          type: string
        surfaceId:
          maxLength: 68
          minLength: 6
          title: Surfaceid
          type: string
        value:
          $ref: '#/components/schemas/JsonValue'
      required:
      - surfaceId
      - path
      - value
      title: UpdateDataModel
      type: object
    UserProfile:
      properties:
        auth_user_id:
          title: Auth User Id
          type: string
        branch:
          anyOf:
          - $ref: '#/components/schemas/Branch'
          - type: 'null'
        email:
          title: Email
          type: string
        institution:
          anyOf:
          - $ref: '#/components/schemas/Institution'
          - type: 'null'
        is_owner:
          default: false
          title: Is Owner
          type: boolean
        name:
          title: Name
          type: string
        permissions:
          items:
            type: string
          title: Permissions
          type: array
        preferences:
          additionalProperties: true
          title: Preferences
          type: object
        role:
          title: Role
          type: string
        tenant_id:
          title: Tenant Id
          type: string
        user_id:
          title: User Id
          type: string
      required:
      - user_id
      - auth_user_id
      - tenant_id
      - email
      - name
      - role
      - permissions
      title: UserProfile
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    VerificationStatus:
      description: Resultado de verificar un hecho candidato (`DIE-F1-052`).
      enum:
      - accepted
      - rejected
      - uncertain
      title: VerificationStatus
      type: string
    VerifiedFact:
      additionalProperties: false
      description: 'Hecho tras pasar por el verificador (§5.2).


        Invariante central: si es crítico y fue aceptado, tiene al menos una

        citación activa y es apto para escritura solo si además está aceptado.'
      properties:
        category:
          $ref: '#/components/schemas/FactCategory'
        citations:
          items:
            $ref: '#/components/schemas/SourceCitation'
          maxItems: 20
          title: Citations
          type: array
        claim:
          maxLength: 1000
          title: Claim
          type: string
        confidence:
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          type: number
        depends_on:
          items:
            maxLength: 68
            minLength: 6
            type: string
          maxItems: 50
          title: Depends On
          type: array
        domain:
          $ref: '#/components/schemas/Domain'
        fact_id:
          maxLength: 68
          minLength: 6
          title: Fact Id
          type: string
        reason:
          description: 'Motivo estable de la decisión. Ejemplo: ''source_expired''.'
          maxLength: 300
          title: Reason
          type: string
        supporting_tool_call_id:
          anyOf:
          - maxLength: 66
            minLength: 4
            type: string
          - type: 'null'
          description: Invocación de tool que respalda el hecho cuando su evidencia
            no es documental. Es la otra forma admisible de fundamentar un claim crítico.
          title: Supporting Tool Call Id
        value:
          $ref: '#/components/schemas/FactValue'
        verification:
          $ref: '#/components/schemas/VerificationStatus'
        write_eligible:
          default: false
          title: Write Eligible
          type: boolean
      required:
      - fact_id
      - claim
      - value
      - category
      - domain
      - verification
      - reason
      - confidence
      title: VerifiedFact
      type: object
    VerifiedFacts:
      additionalProperties: false
      description: 'Snapshot inmutable que reciben estimación final, A2UI y redactor
        (§5.2).


        El redactor solo ve esto: no tiene puertos de RAG ni de MCP, así que este

        snapshot es literalmente el universo de hechos del que puede hablar

        (`DIE-F1-094`).'
      properties:
        contradictions:
          default: []
          items:
            $ref: '#/components/schemas/Contradiction'
          maxItems: 100
          title: Contradictions
          type: array
        created_at:
          format: date-time
          title: Created At
          type: string
        facts:
          items:
            $ref: '#/components/schemas/VerifiedFact'
          maxItems: 500
          title: Facts
          type: array
        snapshot_id:
          maxLength: 120
          title: Snapshot Id
          type: string
      required:
      - snapshot_id
      - created_at
      - facts
      title: VerifiedFacts
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
info:
  description: 'API del backend (Dani). Convenciones: JSON snake_case, UTC, IDs opacos
    (`conv_`, `run_`, `act_`, `apt_`), dinero en unidades menores. Los errores usan
    **Problem Details** (`type/code/status/retryable`); el frontend nunca parsea texto.
    Toda respuesta propaga `X-Trace-Id`. Auth = Supabase Auth (JWT bearer validado
    por JWKS).'
  summary: Gateway HTTP/SSE/webhooks del asistente institucional nexo-ai.
  title: nexo-ai API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/actions/{action_id}/confirm:
    post:
      operationId: confirm_action_api_v1_actions__action_id__confirm_post
      parameters:
      - in: path
        name: action_id
        required: true
        schema:
          title: Action Id
          type: string
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmActionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Error de validación (VALIDATION_ERROR)
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Autenticación requerida (AUTHENTICATION_REQUIRED)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Permiso denegado (PERMISSION_DENIED)
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Conflicto (APPOINTMENT_CONFLICT / VERSION_CONFLICT)
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Confirmación requerida (ACTION_CONFIRMATION_REQUIRED)
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Límite excedido (RATE_LIMITED / BUDGET_EXCEEDED)
      security:
      - HTTPBearer: []
      summary: Confirmar acción (idempotente)
      tags:
      - actions
