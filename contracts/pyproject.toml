[project]
name = "nexo-contracts"
version = "0.1.0"
description = "Contratos tipados compartidos de Nexo IA: fuente de verdad de los JSON Schema publicados."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexo_contracts"]
