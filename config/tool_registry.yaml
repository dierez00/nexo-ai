# Registro de tools — configuración no secreta.
#
# Toda entrada declara versión explícita. Una tool ausente de este archivo, o
# presente sin versión, no existe para el sistema.
#
# `enabled: false` es el default seguro: registrar una tool no la habilita.
#
# Las nueve del MVP están habilitadas desde F1.9: cada una tiene adapter mock,
# contrato de entrada y salida, prueba de contrato y regla de permiso. Las de
# escritura siguen exigiendo confirmación e idempotency key —eso lo impone el
# contrato de `ToolMetadata`, no este archivo—, así que habilitarlas no las hace
# invocables sin consentimiento.
#
# Schema: nexo_contracts.config.ToolRegistryConfig

version: tools-2026-07-30

