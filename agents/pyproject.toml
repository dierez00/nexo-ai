[project]
name = "nexo-agents"
version = "0.1.0"
description = "Agentes de Nexo IA: clasificador, navegadores, verificador, estimador, transaccional y redactor."
requires-python = ">=3.12"
dependencies = [
    "nexo-contracts",
    # Solo por los `Protocol` de recuperación y de tools. Un agente nunca importa
    # una implementación: el retriever y el executor concretos se inyectan desde
    # la orquestación (ver `docs/architecture/module_ownership.md` §4).
    "nexo-rag",
    "nexo-mcp",
    "pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexo_agents"]
