[project]
name = "nexo-mcp"
version = "0.1.0"
description = "Puertos de registro y ejecución de tools de Nexo IA, con dobles en memoria."
requires-python = ">=3.12"
dependencies = [
    "nexo-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexo_mcp"]
