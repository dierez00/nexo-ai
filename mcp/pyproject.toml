[project]
name = "nexo-mcp"
version = "0.1.0"
description = "Puertos de registro y ejecución de tools de Nexo IA, con dobles en memoria."
requires-python = ">=3.12"
dependencies = [
    "nexo-contracts",
    # SDK oficial de MCP: la frontera es de protocolo, no una imitación (ADR 0005).
    "mcp>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexo_mcp"]
