[project]
name = "nexo-orchestration"
version = "0.1.0"
description = "Grafo, estado, puertos de ejecución y emisión de eventos de Nexo IA."
requires-python = ">=3.12"
dependencies = [
    "nexo-contracts",
    "langgraph>=0.2,<0.7",
    "pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexo_orchestration"]
