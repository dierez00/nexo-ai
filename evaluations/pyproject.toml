[project]
name = "nexo-evaluations"
version = "0.1.0"
description = "Dataset capstone y evaluadores deterministas de Nexo IA"
requires-python = ">=3.12"
dependencies = [
    "nexo-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexo_evaluations"]
