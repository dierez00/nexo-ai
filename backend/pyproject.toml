[project]
name = "nexo-api"
version = "0.1.0"
description = "nexo-ai — API FastAPI, auth, rutas, casos de uso"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pyjwt[crypto]>=2.9",
    "nexo-contracts",
    "nexo-integrations",
    "nexo-observability",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexo_api"]

[tool.uv.sources]
nexo-contracts = { workspace = true }
nexo-integrations = { workspace = true }
nexo-observability = { workspace = true }
