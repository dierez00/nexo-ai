[project]
name = "nexo-ai"
version = "0.1.0"
description = "nexo-ai — workspace raíz (paquete virtual)"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "backend",
    "integrations",
    "observability",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

# =============================================================================
# Ruff — linter y formatter compartido
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (seguridad básica)
    "ANN", # anotaciones de tipo
]
ignore = [
    "ANN101", # self no necesita anotación
    "ANN102", # cls no necesita anotación
    "S101",   # assert en tests está bien
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "ANN"]
"**/migrations/**" = ["ANN"]

# =============================================================================
# mypy — type checking compartido
# =============================================================================
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
explicit_package_bases = true
mypy_path = "backend/src:integrations/src:observability/src"

# =============================================================================
# pytest
# =============================================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "backend/tests", "integrations/tests", "observability/tests"]
