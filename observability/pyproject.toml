[project]
name = "nexo-observability"
version = "0.1.0"
description = "nexo-ai — logging JSONL, redacción PII, eventos y hooks OTel"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    # opentelemetry-sdk y exporters se añaden en fase Pro
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexo_observability"]
